name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No homelab details
        env:
          KEYDROP_LEAK_PATTERNS: ${{ secrets.KEYDROP_LEAK_PATTERNS }}
        run: sh scripts/leak-check.sh
      - name: Leak check fails closed
        run: sh scripts/leak-check-test.sh
      - name: go.mod and the Dockerfile use the same Go
        run: sh scripts/go-version-check.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # zero deps: no go.sum to key a cache on
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  # Builds the image once, checks it hands out a working CLI, and stores the
  # layers in the Actions cache so dev-image pushes the same build without
  # compiling it again. Runs alongside test and e2e.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ver
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/dev ]; then
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "version=ci-test" >> "$GITHUB_OUTPUT"
          fi
          echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: keydrop:ci
          # dev-image must pass the same build args, or it misses this cache.
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
            COMMIT_TIME=${{ steps.ver.outputs.time }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image must hand out a working CLI of its own version: install it
      # with the script the server serves, pinned, and run it.
      - name: Install the CLI from the image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          key=$(docker run --rm keydrop:ci genkey)
          docker run -d --name kd -p 127.0.0.1:8443:8443 -e KEYDROP_MASTER_KEY="$key" -e KEYDROP_TLS_HOSTS=127.0.0.1 keydrop:ci
          for i in $(seq 30); do curl -fsSk https://127.0.0.1:8443/healthz && break; sleep 1; done
          docker logs kd 2>&1 | grep -F -- "--pinnedpubkey"
          cmd=$(docker logs kd 2>&1 | grep -o "curl -fsSk --pinnedpubkey .*| sh")
          KEYDROP_INSTALL_DIR="$RUNNER_TEMP/bin" sh -c "$cmd"
          test "$("$RUNNER_TEMP/bin/keydrop" --version)" = "keydrop $VERSION"
          # a wrong pin must refuse to download (set -e ignores "!", hence the if)
          if curl -fsSk --pinnedpubkey 'sha256//AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' https://127.0.0.1:8443/cli/SHA256SUMS; then
            echo "a wrong pin was accepted"; exit 1
          fi
          docker rm -f kd

  # The real binary as server and CLI: setup, pairing, run, restart,
  # rotate-tls, and the upgrade from the previous data format. Full history,
  # because that test builds an older commit.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # zero deps: no go.sum to key a cache on
      - run: go vet -tags e2e ./e2e/...
      - run: go test -tags e2e -count=1 -v ./e2e/...

  # Pushes to dev also publish ghcr.io/<repo>:dev and :dev-<sha>, after the
  # tests pass. Deployments pin the digest, never the moving :dev tag. The
  # build comes from the image job's cache (same platform and VERSION).
  dev-image:
    needs: [test, e2e, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-
      - id: short
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: | # the image job's, so the build comes from its cache
            VERSION=dev-${{ steps.short.outputs.sha }}
            COMMIT=${{ github.sha }}
            COMMIT_TIME=${{ steps.short.outputs.time }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha
      - name: Digest
        run: echo "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
