name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
permissions: {}
jobs:
  # The patterns are the maintainer's own host names, so they live in the
  # leak-check environment, which only main and dev may use: a workflow
  # pushed on any other branch can't read them. Pull requests skip this job;
  # the push to dev or main runs it.
  leak-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: leak-check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No private details
        env:
          KEYDROP_LEAK_PATTERNS: ${{ secrets.KEYDROP_LEAK_PATTERNS }}
        run: sh scripts/leak-check.sh
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Codecov's action runs in this job
      - name: Leak check fails closed
        run: sh scripts/leak-check-test.sh
      - name: Release tags publish what they should
        run: sh scripts/release-version-test.sh
      - name: The autofix routine runs this prompt and setup
        run: sh scripts/autofix-check.sh
      - name: go.mod and the Dockerfile use the same Go
        run: sh scripts/go-version-check.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # zero deps: no go.sum to key a cache on
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      # Unit tests only: the e2e suite runs the real binary, which this
      # profile can't see. An outage at Codecov must not turn CI red.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Builds the image and checks it hands out a working CLI. Runs alongside
  # test and e2e. CI publishes nothing: release.yml does, by hand. The layer
  # cache only speeds up this job. Nothing that publishes may read it, since
  # any job in the workflow can write to it.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ver
        run: |
          echo "version=ci-test" >> "$GITHUB_OUTPUT"
          echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: keydrop:ci
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
            COMMIT_TIME=${{ steps.ver.outputs.time }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image must hand out a working CLI of its own version: install it
      # with the script the server serves, pinned, and run it.
      - name: Install the CLI from the image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          key=$(docker run --rm keydrop:ci genkey)
          docker run -d --name kd -p 127.0.0.1:8443:8443 -e KEYDROP_MASTER_KEY="$key" -e KEYDROP_TLS_HOSTS=127.0.0.1 keydrop:ci
          for i in $(seq 30); do curl -fsSk https://127.0.0.1:8443/healthz && break; sleep 1; done
          docker logs kd 2>&1 | grep -F -- "--pinnedpubkey"
          cmd=$(docker logs kd 2>&1 | grep -o "curl -fsSk --pinnedpubkey .*| sh")
          KEYDROP_INSTALL_DIR="$RUNNER_TEMP/bin" sh -c "$cmd"
          test "$("$RUNNER_TEMP/bin/keydrop" --version)" = "keydrop $VERSION"
          # a wrong pin must refuse to download (set -e ignores "!", hence the if)
          if curl -fsSk --pinnedpubkey 'sha256//AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' https://127.0.0.1:8443/cli/SHA256SUMS; then
            echo "a wrong pin was accepted"; exit 1
          fi
          docker rm -f kd

  # The real binary as server and CLI: setup, pairing, run, restart,
  # rotate-tls, and the upgrade from the previous data format. Full history,
  # because that test builds an older commit.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # zero deps: no go.sum to key a cache on
      - run: go vet -tags e2e ./e2e/...
      - run: go test -tags e2e -count=1 -v ./e2e/...
