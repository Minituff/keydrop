# Hands a failed run that nobody is watching to a Claude Code routine:
# a check on one of Renovate's PRs, a push Renovate merged to main, or a
# release bump-version started. Failures on the maintainer's own pushes and
# PRs are left to them. The routine only opens PRs and issues; it never
# merges, tags or releases (its instructions are in docs/development.md).
# Setting the repository variable AUTOFIX to "off" pauses it.
#
# Only run metadata is sent, never logs or PR text: the routine reads those
# itself, as untrusted data. workflow_run always runs this file as it is on
# main, so a PR can't change what it sends or read the secrets.
name: autofix
on:
  workflow_run:
    workflows: [ci, docs, release, bump-version]
    types: [completed]
  # Sends the given text instead of a failed run, to check the hand-off.
  workflow_dispatch:
    inputs:
      text:
        description: Text to send
        type: string
        required: true
permissions: {}
jobs:
  hand-off:
    if: >-
      vars.AUTOFIX != 'off' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_repository.full_name == github.repository && (
            (github.event.workflow_run.event == 'pull_request' &&
              startsWith(github.event.workflow_run.head_branch, 'renovate/')) ||
            (github.event.workflow_run.event == 'push' &&
              github.event.workflow_run.actor.login == 'renovate[bot]') ||
            (github.event.workflow_run.event == 'workflow_dispatch' &&
              github.event.workflow_run.triggering_actor.login == 'github-actions[bot]')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Hand it off
        env:
          URL: ${{ secrets.AUTOFIX_URL }}
          TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
          TEXT: ${{ inputs.text }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::warning::AUTOFIX_URL or AUTOFIX_TOKEN isn't set; nothing handed off"
            exit 0
          fi
          # A Renovate PR may be fixed; anything else is only diagnosed.
          case $EVENT in
          pull_request) mode=fix ;;
          *) mode=report ;;
          esac
          if [ -z "$TEXT" ]; then
            TEXT=$(printf 'Mode: %s\nFailed run: %s\nWorkflow: %s (run %s, %s)\nBranch: %s\nCommit: %s' \
              "$mode" "$RUN_URL" "$WORKFLOW" "$RUN_ID" "$EVENT" "$BRANCH" "$SHA")
          fi
          # Only the status is printed: the reply links a private session.
          status=$(jq -n --arg text "$TEXT" '{text: $text}' | curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data-binary @-)
          echo "Handed off: HTTP $status"
          [ "$status" -lt 300 ]
