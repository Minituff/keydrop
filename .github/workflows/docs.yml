name: docs
# Builds the MkDocs site on every change to the docs, so a broken link or page
# fails CI. A push to main that changes them also publishes the site to
# GitHub Pages; Actions → docs → Run workflow on main publishes it again.
on:
  push:
    branches: [main, dev]
    paths: ["docs/**", "mkdocs.yml", "README.md", "scripts/docs-index.sh", ".github/workflows/docs.yml", ".github/docs-requirements.*"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "README.md", "scripts/docs-index.sh", ".github/workflows/docs.yml", ".github/docs-requirements.*"]
  workflow_dispatch:
permissions: {}
# One publish at a time, and the newest wins.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Home page matches the README
        run: sh scripts/docs-index.sh --check
      # Every package pinned with its hashes, wheels only, so nothing pip
      # installs (or builds) floats: the site it makes is what people copy
      # install commands from. Python 3.12 is the runner's own.
      - run: |
          pip install --require-hashes --only-binary :all: -r .github/docs-requirements.txt
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  # Only publishes what build made, so nothing from pip runs with these rights.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
