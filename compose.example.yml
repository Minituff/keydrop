# Example deployment. Before the first start:
#   mkdir -p data && sudo chown 65532:65532 data
#   docker run --rm ghcr.io/minituff/keydrop genkey > master.key
#   sudo chown 65532:65532 master.key && sudo chmod 400 master.key
# (Compose mounts the secret file with its host owner and mode, and keydrop
# runs as uid 65532, so a 600 file owned by you would be unreadable to it.
# keydrop warns at start if the key file is readable by anyone else.)
# Back up master.key somewhere other than ./data: without it the data is unreadable.
services:
  keydrop:
    # Pin a digest in production (image@sha256:…) and update on purpose.
    image: ghcr.io/minituff/keydrop:latest
    container_name: keydrop
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      KEYDROP_MASTER_KEY_FILE: /run/secrets/keydrop_master_key
      KEYDROP_PUBLIC_URL: https://secrets.example.com
      # Names/IPs for the self-signed certificate.
      KEYDROP_TLS_HOSTS: secrets.example.com,192.168.1.50
      # If a reverse proxy sits in front, let it pass the real client IP
      # (it must also send X-Forwarded-Proto: https, as Traefik does):
      # KEYDROP_TRUSTED_PROXIES: 192.168.1.10
    secrets:
      - keydrop_master_key
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

secrets:
  keydrop_master_key:
    file: ./master.key
