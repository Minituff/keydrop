{{define "content"}}
<h1>Log</h1>
<table>
<thead><tr><th>When</th><th>Who</th><th>What</th><th>Secret</th><th>From</th></tr></thead>
<tbody>
{{range .Events}}
<tr><td>{{fmtTime .Time}}</td><td>{{.Actor}}</td><td>{{.Action}}{{if .Detail}} <small>{{.Detail}}</small>{{end}}</td><td>{{.Target}}</td><td>{{.IP}}</td></tr>
{{else}}
<tr><td colspan="5" class="muted">Nothing yet.</td></tr>
{{end}}
</tbody>
</table>
{{end}}
