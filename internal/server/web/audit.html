{{define "content"}}
<h1>Log</h1>
<div class="card flush scroll"><table>
<thead><tr><th>When</th><th>Who</th><th>What</th><th>Secret</th><th>From</th></tr></thead>
<tbody>
{{range .Events}}
<tr><td>{{fmtTime .Time}}</td><td>{{.Actor}}</td><td>{{.Action}}{{if .Unauthenticated}} <small class="muted">(no credential)</small>{{end}}{{if .Detail}} <small>{{.Detail}}</small>{{end}}{{if .Text}}<div class="agent-text"><small>agent-written:</small> {{.Text}}</div>{{end}}</td><td>{{.Target}}</td><td>{{.IP}}</td></tr>
{{else}}
<tr><td colspan="5" class="muted">Nothing yet.</td></tr>
{{end}}
</tbody>
</table></div>
{{end}}
